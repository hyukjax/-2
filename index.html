      const MathView = ({ math, displayMode = false }) => {
        const containerRef = React.useRef(null);

        // Normalize backslashes (Replace Korean Won '₩' or '\W' with proper LaTeX '\')
        const cleanMath = (math || '')
          .replace(/₩/g, '\\')
          .replace(/\\W/g, '\\')
          .trim();

        React.useEffect(() => {
          if (window.katex && containerRef.current) {
            try {
              window.katex.render(cleanMath, containerRef.current, {
                displayMode: displayMode,
                throwOnError: false,
                output: 'html'
              });
            } catch (err) {
              console.warn('KaTeX render error:', err);
            }
          }
        }, [cleanMath, displayMode]);

        if (displayMode) {
          return (
            <div className="my-3 p-3.5 bg-slate-950/80 border border-amber-500/30 rounded-xl shadow-lg shadow-amber-500/5 flex flex-col items-center justify-center overflow-x-auto text-amber-300">

                <span className="font-mono text-amber-300 italic">{cleanMath}</span>
              </div>
            </div>
          );
        }

        return (
          <span

            className="inline-flex items-center px-1.5 py-0.5 mx-0.5 bg-amber-500/10 border border-amber-500/30 rounded text-amber-300 font-serif text-sm align-middle"

            isSample: true,
            sampleData: sample
          });
          setAnalysisResult(null);
          setMessages([]);
        };

        const analyzeExperiment = async () => {
          if (!selectedImage) return;

          setAnalyzing(true);
          setActiveTab('report');

          if (selectedImage.isSample && !apiKey) {
            setTimeout(() => {
              setAnalysisResult(selectedImage.sampleData.mockResult);
              initializeChat(selectedImage.sampleData.mockResult);
              setAnalyzing(false);
            }, 1200);
            return;
          }

          try {
            let base64Data = selectedImage.data;
            let mimeType = selectedImage.mimeType || 'image/png';

            if (selectedImage.isSample) {
              base64Data = btoa(selectedImage.sampleData.dataUri);
              mimeType = 'image/svg+xml';
            }

            const payload = {
              contents: [
                {
                  role: 'user',
                  parts: [
                    { text: DEFAULT_SYSTEM_PROMPT },
                    {
                      inlineData: {
                        mimeType: mimeType.includes('svg') ? 'image/png' : mimeType,
                        data: base64Data
                      }
                    }
                  ]
                }
              ]
            };

            const keyToUse = apiKey || "";
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${keyToUse}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }
            );

            const result = await response.json();
            const outputText = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (outputText) {
              setAnalysisResult(outputText);
              initializeChat(outputText);
            } else {
              throw new Error('응답을 생성할 수 없습니다.');
            }
          } catch (err) {
            console.error(err);
            if (selectedImage?.isSample) {
              setAnalysisResult(selectedImage.sampleData.mockResult);
              initializeChat(selectedImage.sampleData.mockResult);
            } else {
              alert(`분석 실패: ${err.message || 'Gemini API 호출에 실패했습니다.'}`);
            }
          } finally {
            setAnalyzing(false);
          }
        };

        const initializeChat = (reportText) => {
          setMessages([
            {
              sender: 'ai',
              text: `안녕하세요! 분석된 물리학 실험 리포트를 바탕으로 학습을 도와드릴 AI 보조교사입니다. 👨‍🏫\n\n수식 이해, 물리 원리, 오차 분석 등 궁금한 점을 질문해보세요!`
            }
          ]);
        };

        const handleSendMessage = async (textToSend) => {
          const query = textToSend || inputQuestion;
          if (!query.trim() || chatLoading) return;

          const userMsg = { sender: 'user', text: query };
          setMessages((prev) => [...prev, userMsg]);
          setInputQuestion('');
          setChatLoading(true);

          try {
            const systemContext = `[Role]\n당신은 고등학생의 질문을 친절히 풀어 설명하는 물리학 AI 튜터입니다.\n\n[Context]\n분석된 실험 결과:\n${analysisResult || ''}\n\n[Guidelines]\n1. 모든 수식은 반드시 LaTeX($...$ 또는 $$...$$) 표기를 사용하세요.\n2. 이해하기 쉬운 비유와 힌트를 활용하세요.`;

            const contentsPayload = [
              {
                role: 'user',
                parts: [{ text: `${systemContext}\n\n학생 질문: ${query}` }]
              }
            ];

            const keyToUse = apiKey || "";
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${keyToUse}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: contentsPayload })
              }
            );

            const result = await response.json();
            const answerText = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (answerText) {
              setMessages((prev) => [...prev, { sender: 'ai', text: answerText }]);
            } else {
              setMessages((prev) => [
                ...prev,
                { sender: 'ai', text: '죄송합니다, 답변 생성 중 문제가 발생했습니다.' }
              ]);
            }
          } catch (error) {
            console.error(error);
            setMessages((prev) => [
              ...prev,
              { sender: 'ai', text: '네트워크 연결 또는 API 설정을 확인해주세요.' }
            ]);
          } finally {
            setChatLoading(false);
          }
        };

        const renderFormattedMarkdown = (content) => {
          if (!content) return null;

          // Normalize Won signs (₩ -> \)
          const normalized = content.replace(/₩/g, '\\').replace(/\\W/g, '\\');

          // Split text by display math blocks ($$...$$) first
          const blocks = normalized.split(/(\$\$\s*[\s\S]*?\s*\$\$)/g);

          return blocks.map((block, bIdx) => {
            if (block.startsWith('$$') && block.endsWith('$$')) {
              const mathCode = block.slice(2, -2).trim();
              return <MathView key={`block-${bIdx}`} math={mathCode} displayMode={true} />;
            }

            // Line by line parsing for headers and list items
            const lines = block.split('\n');
            return lines.map((line, lIdx) => {
              const key = `${bIdx}-${lIdx}`;
              if (line.startsWith('## ')) {
                return (
                  <h3 key={key} className="text-xl font-bold text-sky-400 mt-6 mb-3 flex items-center gap-2 border-b border-slate-700 pb-2">
                    {renderInlineParts(line.replace('## ', ''))}
                  </h3>
                );
              }
              if (line.trim().startsWith('- ')) {
                return (
                  <li key={key} className="ml-4 mb-2 text-slate-200 list-disc leading-relaxed">
                    {renderInlineParts(line.trim().substring(2))}
                  </li>
                );
              }
              if (!line.trim()) {
                return <div key={key} className="h-2"></div>;
              }
              return (
                <p key={key} className="text-slate-300 mb-2 leading-relaxed">
                  {renderInlineParts(line)}
                </p>
              );
            });
          });
        };

        const renderInlineParts = (text) => {
          // Split by inline math ($...$) and bold (**...**)
          const parts = text.split(/(\$.*?\$|\*\*.*?\*\*)/g);
          return parts.map((part, pIdx) => {
            if (part.startsWith('$') && part.endsWith('$')) {
              return <MathView key={pIdx} math={part.slice(1, -1)} displayMode={false} />;
            }
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={pIdx} className="text-sky-300 font-semibold">{part.slice(2, -2)}</strong>;
            }
            return part;
          });
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col">
            {/* Top Header */}
            <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-sky-500/20 text-sky-400 rounded-xl border border-sky-500/30">
                  <Zap className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white flex items-center gap-2">
                    Gemini 물리학 실험 분석 AI <span className="text-xs px-2 py-0.5 bg-sky-500/20 text-sky-400 rounded-full font-normal border border-sky-500/30">LaTeX 수식 렌더러 탑재</span>
                  </h1>
                  <p className="text-xs text-slate-400">교과서 사진 ➔ KaTeX 수식 분석 ➔ AI 튜터 Q&A</p>
                </div>
              </div>

              {/* API Key Controls */}
              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-2 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300">
                  <Key className="w-3.5 h-3.5 text-amber-400" />
                  <input
                    type="password"
                    placeholder="Gemini API Key (선택사항)"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-transparent border-none outline-none text-white w-40 placeholder-slate-500 text-xs"
                  />
                </div>
                <button
                  onClick={() => {
                    setSelectedImage(null);
                    setImagePreview(null);
                    setAnalysisResult(null);
                    setMessages([]);
                  }}
                  className="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700"
                >
                  <RefreshCw className="w-3.5 h-3.5" /> 초기화
                </button>
              </div>
            </header>

            {/* Main Container */}
            <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {}
              {/* Left Column */}
              <div className="lg:col-span-5 flex flex-col gap-6">
                
                {/* File Upload Box */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  <h2 className="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
                    <Upload className="w-4 h-4 text-sky-400" /> 교과서 실험 사진 업로드
                  </h2>

                  {imagePreview ? (
                    <div className="relative rounded-xl overflow-hidden border border-slate-700 bg-slate-950 group">
                      <img
                        src={imagePreview}
                        alt="Experiment Preview"
                        className="w-full h-56 object-contain p-2"
                      />
                      <button
                        onClick={() => {
                          setImagePreview(null);
                          setSelectedImage(null);
                          setAnalysisResult(null);
                        }}
                        className="absolute top-2 right-2 bg-slate-900/90 text-slate-300 hover:text-white p-1.5 rounded-lg text-xs border border-slate-700"
                      >
                        변경
                      </button>
                    </div>
                  ) : (
                    <label className="border-2 border-dashed border-slate-700 hover:border-sky-500/50 bg-slate-950/50 hover:bg-slate-950 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer transition group text-center">
                      <div className="p-3 bg-sky-500/10 group-hover:bg-sky-500/20 text-sky-400 rounded-full mb-3 transition">
                        <ImageIcon className="w-6 h-6" />
                      </div>
                      <span className="text-sm font-medium text-slate-300 group-hover:text-white mb-1">
                        사진 촬영 또는 파일 선택
                      </span>
                      <span className="text-xs text-slate-500">
                        고등학교 물리학 I, II 교과서 실험 사진
                      </span>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleFileUpload}
                        className="hidden"
                      />
                    </label>
                  )}

                  <button
                    onClick={analyzeExperiment}
                    disabled={!selectedImage || analyzing}
                    className={`w-full mt-4 py-3 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition ${
                      !selectedImage || analyzing
                        ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                        : 'bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white shadow-lg shadow-sky-500/20'
                    }`}
                  >
                    {analyzing ? (
                      <>
                        <RefreshCw className="w-4 h-4 animate-spin" /> 수식 및 실험 분석 중...
                      </>
                    ) : (
                      <>
                        <Sparkles className="w-4 h-4" /> AI 실험 분석 시작하기
                      </>
                    )}
                  </button>
                </div>

                {/* Sample Experiments */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                      <BookOpen className="w-4 h-4 text-emerald-400" /> 샘플 수식 실험 테스트
                    </h3>
                    <span className="text-xs text-slate-500">클릭 시 자동 세팅</span>
                  </div>

                  <div className="space-y-2.5">
                    {SAMPLE_EXPERIMENTS.map((sample) => (
                      <button
                        key={sample.id}
                        onClick={() => handleSelectSample(sample)}
                        className={`w-full text-left p-3 rounded-xl border transition flex items-center justify-between ${
                          selectedImage?.sampleData?.id === sample.id
                            ? 'bg-sky-500/10 border-sky-500/50 text-white'
                            : 'bg-slate-950/60 hover:bg-slate-800/60 border-slate-800 text-slate-300'
                        }`}
                      >
                        <div>
                          <div className="font-medium text-xs text-sky-400">{sample.chapter}</div>
                          <div className="text-sm font-semibold text-white mt-0.5">{sample.title}</div>
                          <div className="text-xs text-slate-400 mt-0.5">{sample.description}</div>
                        </div>
                        <ArrowRight className="w-4 h-4 text-slate-500 shrink-0 ml-2" />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 text-xs text-slate-400 leading-relaxed">
                  <div className="flex items-center gap-1.5 font-semibold text-slate-300 mb-1">
                    <CheckCircle2 className="w-4 h-4 text-emerald-400" /> LaTeX 자동 정밀교정 렌더러
                  </div>
                  한글 키보드의 원화 표기(`₩`)나 단순 텍스트 백슬래시 오출력을 자동 감지하여 교정하며, KaTeX 엔진으로 수식을 아름답게 보정합니다.
                </div>

              </div>

              {}
              {/* Right Column: Reports & Q&A */}
              <div className="lg:col-span-7 flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl min-h-[560px]">
                
                <div className="border-b border-slate-800 bg-slate-950/50 px-4 pt-3 flex items-center gap-2">
                  <button
                    onClick={() => setActiveTab('report')}
                    className={`flex items-center gap-2 px-4 py-2.5 font-semibold text-xs rounded-t-xl transition ${
                      activeTab === 'report'
                        ? 'bg-slate-900 text-sky-400 border-t border-x border-slate-800'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <FileText className="w-4 h-4" /> 1단계: 실험 분석 리포트
                  </button>
                  <button
                    onClick={() => setActiveTab('chat')}
                    disabled={!analysisResult}
                    className={`flex items-center gap-2 px-4 py-2.5 font-semibold text-xs rounded-t-xl transition ${
                      activeTab === 'chat'
                        ? 'bg-slate-900 text-sky-400 border-t border-x border-slate-800'
                        : 'text-slate-400 hover:text-slate-200'
                    } ${!analysisResult ? 'opacity-40 cursor-not-allowed' : ''}`}
                  >
                    <MessageSquare className="w-4 h-4" /> 2단계: AI 튜터 Q&A
                  </button>
                </div>

                <div className="flex-1 p-6 flex flex-col">
                  
                  {/* TAB 1: Report Analysis */}
                  {activeTab === 'report' && (
                    <div className="flex-1 flex flex-col">
                      {analyzing ? (
                        <div className="flex-1 flex flex-col items-center justify-center py-12 text-center">
                          <div className="relative mb-4">
                            <div className="w-12 h-12 rounded-full border-4 border-sky-500/20 border-t-sky-400 animate-spin"></div>
                            <Calculator className="w-5 h-5 text-sky-400 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" />
                          </div>
                          <p className="text-sm font-medium text-slate-200">Gemini가 교과서 수식 및 실험을 렌더링 중입니다...</p>
                        </div>
                      ) : analysisResult ? (
                        <div className="space-y-2 text-sm leading-relaxed overflow-y-auto max-h-[600px] pr-2 custom-scrollbar">
                          {renderFormattedMarkdown(analysisResult)}

                          <div className="mt-8 pt-4 border-t border-slate-800 flex justify-end">
                            <button
                              onClick={() => setActiveTab('chat')}
                              className="bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/40 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition"
                            >
                              이 수식과 실험에 대해 질문하기 <ArrowRight className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="flex-1 flex flex-col items-center justify-center py-16 text-center">
                          <div className="p-4 bg-slate-800/50 rounded-2xl border border-slate-800 mb-3 text-slate-500">
                            <Calculator className="w-8 h-8 text-sky-400" />
                          </div>
                          <h3 className="text-base font-semibold text-slate-300">실험 사진을 준비해 주세요</h3>
                          <p className="text-xs text-slate-500 max-w-xs mt-1">
                            좌측에서 패러데이 법칙 등 샘플 실험을 선택하거나 사진을 올리면 수식이 정밀하게 표현됩니다.
                          </p>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 2: Chat */}
                  {activeTab === 'chat' && (
                    <div className="flex-1 flex flex-col justify-between h-full">
                      
                      <div className="flex-1 overflow-y-auto space-y-4 max-h-[420px] pr-2 mb-4 custom-scrollbar">
                        {messages.map((msg, idx) => (
                          <div
                            key={idx}
                            className={`flex gap-3 ${
                              msg.sender === 'user' ? 'justify-end' : 'justify-start'
                            }`}
                          >
                            {msg.sender === 'ai' && (
                              <div className="w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 border border-sky-500/30 flex items-center justify-center shrink-0 text-xs">
                                <Bot className="w-4 h-4" />
                              </div>
                            )}
                            <div
                              className={`max-w-[85%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${
                                msg.sender === 'user'
                                  ? 'bg-sky-600 text-white rounded-br-none'
                                  : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                              }`}
                            >
                              {msg.sender === 'ai' ? renderFormattedMarkdown(msg.text) : msg.text}
                            </div>
                            {msg.sender === 'user' && (
                              <div className="w-8 h-8 rounded-xl bg-slate-700 text-slate-300 flex items-center justify-center shrink-0 text-xs">
                                <User className="w-4 h-4" />
                              </div>
                            )}
                          </div>
                        ))}

                        {chatLoading && (
                          <div className="flex gap-3 justify-start items-center text-xs text-slate-400">
                            <div className="w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 border border-sky-500/30 flex items-center justify-center shrink-0">
                              <Bot className="w-4 h-4" />
                            </div>
                            <div className="bg-slate-800 px-4 py-2.5 rounded-2xl border border-slate-700 flex items-center gap-2">
                              <RefreshCw className="w-3.5 h-3.5 animate-spin text-sky-400" />
                              Gemini AI 보조교사가 답변과 수식을 작성하고 있습니다...
                            </div>
                          </div>
                        )}
                        <div ref={chatEndRef} />
                      </div>

                      {/* Suggested Questions */}
                      <div className="mb-3">
                        <div className="text-[11px] text-slate-400 mb-1.5 flex items-center gap-1 font-medium">
                          <HelpCircle className="w-3 h-3 text-sky-400" /> 추천 질문 목록
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {suggestedQuestions.map((q, qIdx) => (
                            <button
                              key={qIdx}
                              onClick={() => handleSendMessage(q)}
                              disabled={chatLoading}
                              className="text-[11px] bg-slate-800/90 hover:bg-slate-700/90 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg transition text-left"
                            >
                              {q}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Chat Input */}
                      <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                        <input
                          type="text"
                          value={inputQuestion}
                          onChange={(e) => setInputQuestion(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                          placeholder="수식 원리나 오차 원인에 대한 궁금증을 풀어보세요..."
                          disabled={chatLoading}
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-sky-500 transition"
                        />
                        <button
                          onClick={() => handleSendMessage()}
                          disabled={!inputQuestion.trim() || chatLoading}
                          className="p-2.5 bg-sky-500 hover:bg-sky-400 disabled:bg-slate-800 text-white rounded-xl transition shadow-md shadow-sky-500/20 shrink-0"
                        >
                          <Send className="w-4 h-4" />
                        </button>
                      </div>

                    </div>
                  )}

                </div>

              </div>

            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
